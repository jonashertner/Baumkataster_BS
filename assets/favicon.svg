<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Canopy gradient: rich layered green -->
    <radialGradient id="canopy" cx="50%" cy="42%" r="50%" fx="45%" fy="38%">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="55%" stop-color="#43A047"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </radialGradient>
    <!-- Light highlight on canopy -->
    <radialGradient id="highlight" cx="38%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#A5D6A7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#A5D6A7" stop-opacity="0"/>
    </radialGradient>
    <!-- Trunk gradient -->
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5D4037"/>
      <stop offset="50%" stop-color="#6D4C41"/>
      <stop offset="100%" stop-color="#4E342E"/>
    </linearGradient>
    <!-- Soft ground shadow -->
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1B5E20" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1B5E20" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="256" cy="460" rx="120" ry="18" fill="url(#shadow)"/>

  <!-- Trunk -->
  <rect x="232" y="310" width="48" height="140" rx="8" fill="url(#trunk)"/>
  <!-- Trunk detail lines -->
  <line x1="248" y1="320" x2="248" y2="440" stroke="#4E342E" stroke-width="1.5" opacity="0.3"/>
  <line x1="264" y1="325" x2="264" y2="435" stroke="#4E342E" stroke-width="1" opacity="0.2"/>

  <!-- Main canopy — organic tree shape using overlapping ellipses -->
  <!-- Bottom-left lobe -->
  <ellipse cx="200" cy="230" rx="100" ry="90" fill="url(#canopy)"/>
  <!-- Bottom-right lobe -->
  <ellipse cx="310" cy="235" rx="95" ry="85" fill="url(#canopy)"/>
  <!-- Top-center lobe -->
  <ellipse cx="256" cy="175" rx="110" ry="100" fill="url(#canopy)"/>
  <!-- Upper-left accent -->
  <ellipse cx="190" cy="170" rx="70" ry="65" fill="url(#canopy)"/>
  <!-- Upper-right accent -->
  <ellipse cx="320" cy="180" rx="65" ry="60" fill="url(#canopy)"/>
  <!-- Crown top -->
  <ellipse cx="256" cy="120" rx="75" ry="65" fill="url(#canopy)"/>
  <!-- Small crown tip -->
  <ellipse cx="256" cy="85" rx="45" ry="40" fill="#43A047"/>

  <!-- Light highlight overlay -->
  <ellipse cx="220" cy="150" rx="90" ry="80" fill="url(#highlight)"/>

  <!-- Subtle leaf texture dots -->
  <circle cx="195" cy="145" r="4" fill="#81C784" opacity="0.5"/>
  <circle cx="230" cy="120" r="3" fill="#A5D6A7" opacity="0.4"/>
  <circle cx="280" cy="135" r="3.5" fill="#81C784" opacity="0.45"/>
  <circle cx="310" cy="165" r="3" fill="#A5D6A7" opacity="0.35"/>
  <circle cx="175" cy="200" r="3.5" fill="#81C784" opacity="0.4"/>
  <circle cx="335" cy="210" r="3" fill="#A5D6A7" opacity="0.3"/>
  <circle cx="256" cy="100" r="2.5" fill="#C8E6C9" opacity="0.5"/>
  <circle cx="215" cy="240" r="3" fill="#66BB6A" opacity="0.3"/>
  <circle cx="290" cy="250" r="2.5" fill="#81C784" opacity="0.35"/>
</svg>
