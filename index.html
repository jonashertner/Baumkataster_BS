<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Mein Baum Basel – Interaktive Karte aller Bäume der Stadt Basel." />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)" />

  <title>Mein Baum Basel</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

  <!-- Mapbox GL JS v3 -->
  <link
    href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css"
    rel="stylesheet"
  />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>

  <!-- Turf.js (spatial helpers) -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

  <!-- Inter typeface (optional — falls back gracefully) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Project styles -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ── Top navigation ──────────────────────────────────── -->
  <nav id="top-nav" role="banner">
    <div class="nav-left">
      <!-- Tree logo mark -->
      <span class="nav-logo-icon" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
          <rect x="232" y="310" width="48" height="140" rx="8" fill="#6D4C41"/>
          <ellipse cx="200" cy="230" rx="100" ry="90" fill="#43A047"/>
          <ellipse cx="310" cy="235" rx="95" ry="85" fill="#43A047"/>
          <ellipse cx="256" cy="175" rx="110" ry="100" fill="#4CAF50"/>
          <ellipse cx="190" cy="170" rx="70" ry="65" fill="#4CAF50"/>
          <ellipse cx="320" cy="180" rx="65" ry="60" fill="#4CAF50"/>
          <ellipse cx="256" cy="120" rx="75" ry="65" fill="#4CAF50"/>
          <ellipse cx="256" cy="85" rx="45" ry="40" fill="#66BB6A"/>
          <ellipse cx="220" cy="150" rx="70" ry="60" fill="#81C784" opacity="0.3"/>
        </svg>
      </span>
      <span class="nav-logo-text" data-i18n="nav.title">Mein Baum Basel</span>
    </div>

    <div class="nav-right">
      <!-- Geschichten (Stories) button -->
      <button
        id="btn-stories"
        class="nav-btn"
        aria-label="Geschichten öffnen"
        data-i18n-aria="nav.stories.aria"
      >
        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
        <span class="nav-btn-label" data-i18n="nav.stories">Geschichten</span>
      </button>

      <!-- Stats icon button -->
      <button
        id="btn-stats"
        class="nav-btn nav-btn--icon"
        aria-label="Statistiken anzeigen"
        data-i18n-aria="nav.stats.aria"
      >
        <!-- Bar chart icon -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3"  y="12" width="4" height="9"/>
          <rect x="10" y="7"  width="4" height="14"/>
          <rect x="17" y="3"  width="4" height="18"/>
        </svg>
      </button>

      <!-- Language toggle -->
      <button
        id="btn-lang"
        class="nav-btn nav-btn--lang"
        aria-label="Switch language to English"
        data-i18n-aria="nav.lang.aria"
      >
        <span data-i18n="nav.lang">EN</span>
      </button>

      <!-- Filter toggle -->
      <button
        id="btn-filter-toggle"
        class="nav-btn nav-btn--icon"
        aria-label="Filter"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- ── Filter panel (populated by ui.js) ─────────────────── -->
  <div id="filter-panel" class="filter-panel hidden" role="search" aria-label="Baumfilter">
    <div class="filter-panel-inner">
      <!-- ui.js inserts filter sections here -->
    </div>
  </div>

  <!-- ── Map container ────────────────────────────────────── -->
  <div id="map" role="main" aria-label="Interaktive Baumkarte Basel"></div>

  <!-- ── Loading overlay ──────────────────────────────────── -->
  <div id="loading-overlay" role="status" aria-live="polite">
    <div class="loading-inner">
      <!-- Basel map with tree dots -->
      <div class="loading-map" aria-hidden="true">
        <svg class="basel-outline" viewBox="0 0 340 320" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Simplified Basel-Stadt cantonal boundary -->
          <path class="basel-border" d="
            M170 8 C190 8 225 18 248 35 C268 50 285 68 295 90
            C305 112 310 135 308 158 C306 175 298 192 288 205
            C278 218 265 228 252 238 C240 247 228 255 218 266
            C208 277 200 290 188 298 C175 307 158 312 140 310
            C122 308 108 298 95 286 C82 274 72 260 60 245
            C48 230 38 212 32 192 C26 172 24 150 28 130
            C32 110 42 92 56 76 C70 60 88 48 108 38
            C128 28 150 8 170 8 Z
          " stroke="var(--c-border)" stroke-width="1.5" fill="none" opacity="0.4"/>
          <!-- Rhine river -->
          <path class="basel-rhine" d="
            M308 155 C295 160 275 162 258 168 C240 174 225 182 210 188
            C195 194 180 198 165 195 C150 192 138 184 125 178
            C112 172 98 168 82 170 C66 172 48 180 32 190
          " stroke="var(--c-border)" stroke-width="2.5" fill="none" opacity="0.15" stroke-linecap="round"/>
        </svg>
        <!-- Tree dots get inserted here by JS -->
        <div class="loading-dots" id="loading-dots"></div>
      </div>
      <div class="loading-text-block">
        <div class="loading-counter" id="loading-counter">0</div>
        <div class="loading-label">Bäume in Basel</div>
      </div>
    </div>
  </div>

  <!-- ── Error overlay (hidden by default) ────────────────── -->
  <div id="error-overlay" class="hidden" role="alert" aria-live="assertive">
    <div class="error-inner">
      <p class="error-message" data-i18n="error.message">Die Baumdaten konnten nicht geladen werden.</p>
      <button id="btn-retry" class="btn-primary" data-i18n="error.retry">Erneut versuchen</button>
    </div>
  </div>

  <!-- ── "Finde meinen Baum" floating card ────────────────── -->
  <div id="find-my-tree" role="complementary" aria-label="Baum in der Nähe finden">
    <button id="find-my-tree-close" class="card-close" aria-label="Schliessen">&times;</button>
    <button id="btn-find-tree" class="find-tree-btn">
      <!-- Crosshair / location icon -->
      <span class="find-tree-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <line x1="12" y1="2"  x2="12" y2="6"/>
          <line x1="12" y1="18" x2="12" y2="22"/>
          <line x1="2"  y1="12" x2="6"  y2="12"/>
          <line x1="18" y1="12" x2="22" y2="12"/>
        </svg>
      </span>
      <span class="find-tree-text">
        <strong class="find-tree-heading" data-i18n="findTree.title">Finde deinen Baum</strong>
        <span class="find-tree-sub" data-i18n="findTree.sub">Entdecke den Baum in deiner Nähe</span>
      </span>
    </button>
  </div>

  <!-- ── FAB – find-my-tree (hidden by default on desktop) ── -->
  <button
    id="find-my-tree-fab"
    class="fab hidden"
    aria-label="Baum in der Nähe finden"
    data-i18n-aria="findTree.fab.aria"
  >
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"/>
      <line x1="12" y1="2"  x2="12" y2="6"/>
      <line x1="12" y1="18" x2="12" y2="22"/>
      <line x1="2"  y1="12" x2="6"  y2="12"/>
      <line x1="18" y1="12" x2="22" y2="12"/>
    </svg>
  </button>

  <!-- ── Tree detail panel (right side, hidden by default) ── -->
  <aside
    id="tree-detail"
    class="panel panel--right hidden"
    role="complementary"
    aria-label="Baumdetails"
    aria-hidden="true"
  >
    <!-- ui.js populates this panel -->
  </aside>

  <!-- ── Stories panel (left side, hidden by default) ─────── -->
  <aside
    id="stories-panel"
    class="panel panel--left hidden"
    role="complementary"
    aria-label="Baumgeschichten"
    aria-hidden="true"
  >
    <!-- stories.js populates this panel -->
  </aside>

  <!-- ── Stats overlay (fullscreen, hidden by default) ─────── -->
  <div
    id="stats-overlay"
    class="stats-overlay hidden"
    role="dialog"
    aria-modal="true"
    aria-label="Baumstatistiken"
    aria-hidden="true"
  >
    <!-- stats.js populates this overlay -->
  </div>

  <!-- ── App entry point (ES module) ─────────────────────── -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
